<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Money Pals</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Nunito:wght@400;600;700&display=swap">
<style>
:root{
--bg:#f8eee3;--panel:#fffdf8;--soft:#f6e7d6;--ink:#6a4c3f;--ink2:#a38064;--line:#ecd7bd;
--accent:#f0669b;--accent-ink:#ffffff;--gold:#ffd84d;--warn:#c97a1e;--bad:#d95b73;
--shadow:0 12px 30px rgba(186,132,92,.16);--bub:#fffbe0;--bubline:#ffe28a;--bubink:#6d5a1a;
color-scheme:light;
}
:root[data-t="dark"]{--bg:#1c1326;--panel:#2a1c37;--soft:#38264a;--ink:#f7e8f4;--ink2:#bd9fc7;--line:#4c3563;--accent:#ff86b4;--accent-ink:#2a0f1e;--gold:#ffd84d;--warn:#ffb15c;--bad:#ff8aa0;--shadow:0 12px 30px rgba(0,0,0,.45);--bub:#3a2f22;--bubline:#7a6230;--bubink:#f6e3a1;color-scheme:dark;}
:root[data-m="spooky"]{--bg:#f3e8ff;--panel:#fffdf8;--soft:#e7d2ff;--ink:#4b3556;--ink2:#93709f;--line:#d3b8f2;--accent:#ff8c42;--accent-ink:#ffffff;--gold:#ffb84d;--shadow:0 12px 30px rgba(122,72,180,.20);--bub:#fff3df;--bubline:#ffcf9e;--bubink:#6d4a1a}
:root[data-m="spooky"][data-t="dark"]{--bg:#150f28;--panel:#231740;--soft:#2e2050;--ink:#f2e7ff;--ink2:#bda3e0;--line:#483573;--accent:#ff9a4d;--accent-ink:#2a1500;--shadow:0 12px 30px rgba(0,0,0,.5);--bub:#3a2c1c;--bubline:#7a5a30;--bubink:#f6dfa1}
:root[data-m="princess"]{--bg:#ffe9f5;--panel:#fff9fc;--soft:#ffd5e9;--ink:#7c3a5f;--ink2:#bd6f9c;--line:#ffc0dc;--accent:#ff5fa8;--accent-ink:#ffffff;--gold:#ffd84d;--shadow:0 12px 30px rgba(255,95,168,.22);--bub:#fffbe0;--bubline:#ffe28a;--bubink:#6d5a1a}
:root[data-m="princess"][data-t="dark"]{--bg:#240f1d;--panel:#351a2a;--soft:#422134;--ink:#ffe6f1;--ink2:#d99cbc;--line:#633049;--accent:#ff70b3;--accent-ink:#2a0a18;--shadow:0 12px 30px rgba(0,0,0,.5);--bub:#3a2a1c;--bubline:#7a6230;--bubink:#f6e3a1}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Nunito',system-ui,sans-serif;font-size:15px;line-height:1.45;padding-inline:16px;padding-block:20px 40px;min-height:100%;transition:background .4s,color .4s}
.wrap{max-width:980px;margin:0 auto}
h1,h2,.amt,.disp{font-family:'Fredoka','Nunito',system-ui,sans-serif}
button{font-family:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.tnum{font-variant-numeric:tabular-nums}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.top h1{margin:0;font-size:30px;font-weight:600;letter-spacing:.01em}
.dateline{margin:2px 0 0;color:var(--ink2);font-size:13px}
.tools{display:flex;align-items:center;gap:8px}
.sw{width:30px;height:30px;border-radius:50%;border:3px solid var(--panel);box-shadow:0 0 0 2px var(--line);cursor:pointer;padding:0}
.sw[aria-pressed="true"]{box-shadow:0 0 0 3px var(--ink)}
.chipbtn{background:var(--panel);border:2px solid var(--line);border-radius:99px;padding:6px 14px;font-weight:700;font-size:13px;cursor:pointer}
.chipbtn:hover{background:var(--soft)}
.chipbtn svg{width:15px;height:15px;vertical-align:-2px;margin-right:5px}
.penny[hidden]{display:none!important}
.penny{display:flex;align-items:center;gap:12px;margin:18px 0 6px}
.pennyart{width:84px;flex:none;background:none;border:0;padding:0;cursor:pointer}
.pennyart svg{width:100%;height:auto;display:block}
.bubble{position:relative;background:var(--bub);border:2px solid var(--bubline);color:var(--bubink);border-radius:18px;padding:10px 16px;font-weight:700;min-height:44px;display:flex;align-items:center;transition:opacity .35s}
.bubble::before{content:"";position:absolute;left:-9px;top:50%;width:14px;height:14px;background:var(--bub);border-left:2px solid var(--bubline);border-bottom:2px solid var(--bubline);transform:translateY(-50%) rotate(45deg)}
.bubble.fade{opacity:0}
.sum{display:grid;grid-template-columns:repeat(4,1fr);margin:16px 0 4px;border-block:2px dashed var(--line)}
.sum div{padding:12px 10px;text-align:center}
.sum div+div{border-left:2px dashed var(--line)}
.sum b{display:block;font-family:'Fredoka',sans-serif;font-weight:500;font-size:21px}
.sum span{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);font-weight:700}
.ex{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:var(--soft);border-radius:14px;padding:10px 14px;margin-top:14px;font-size:13px;font-weight:600}
.sh{display:flex;justify-content:space-between;align-items:center;margin:26px 0 10px;gap:10px}
.sh h2{margin:0;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2);font-weight:600}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:99px;padding:9px 18px;font-weight:800;font-size:14px;cursor:pointer;box-shadow:0 6px 16px rgba(240,102,155,.35);transition:transform .12s,box-shadow .2s}
.btn:hover{transform:translateY(-1px);box-shadow:0 8px 20px rgba(240,102,155,.45)}
.btn.sm{padding:6px 14px;font-size:12.5px}
.btn:active{transform:translateY(1px);box-shadow:0 2px 8px rgba(240,102,155,.3)}
.btn:hover{filter:brightness(1.06)}.btn:active{transform:translateY(2px);box-shadow:none}
.btn.ghost{background:var(--panel);color:var(--ink);border:2px solid var(--line);box-shadow:none}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.pal{position:relative;display:grid;grid-template-columns:1fr;text-align:center;background:var(--panel);border:2px solid var(--pb,var(--line));border-radius:26px;box-shadow:var(--shadow);padding:10px 10px 14px;cursor:pointer;font-size:inherit;transition:transform .18s ease,box-shadow .25s ease}
.pal.add{border-style:dashed;box-shadow:none;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:150px;color:var(--ink2)}
.pal.add .plus{font-size:40px;line-height:1;color:var(--accent)}
.pal.add .nm{font-weight:800;font-size:15px}
.pal:hover{transform:translateY(-3px);box-shadow:0 18px 36px rgba(240,102,155,.22)}
.pal:active{transform:translateY(0)}
.pal:hover,.pal:focus-visible{transform:translateY(-3px)}
:root[data-t="dark"] .pal{border-color:color-mix(in srgb,var(--pb) 70%,transparent);box-shadow:0 10px 26px rgba(0,0,0,.45)}
:root[data-t="dark"] .pal:hover,:root[data-t="dark"] .pal:focus-visible{transform:translateY(-3px);box-shadow:0 16px 34px rgba(0,0,0,.5)}
:root[data-t="dark"] .art svg{filter:drop-shadow(0 6px 10px rgba(0,0,0,.45))}
:root[data-t="dark"] .pennyart svg{filter:drop-shadow(0 4px 8px rgba(0,0,0,.45))}
:root[data-t="dark"] .bubble{box-shadow:0 8px 20px rgba(0,0,0,.4)}
:root[data-t="dark"] .btn{box-shadow:0 6px 16px rgba(0,0,0,.4)}
:root[data-t="dark"] .btn.ghost,:root[data-t="dark"] .chipbtn{box-shadow:0 4px 12px rgba(0,0,0,.35)}
:root[data-t="dark"] .stk:not(.lock){box-shadow:0 5px 14px rgba(0,0,0,.4)}
.pal.hop{animation:hop .7s ease}
@keyframes hop{0%,100%{transform:translateY(0)}25%{transform:translateY(-14px) scale(1.04)}50%{transform:translateY(0) scale(.97,1.03)}75%{transform:translateY(-5px)}}
.art{display:block}.art svg{width:100%;height:auto;max-height:128px;display:block}
.info{display:block}
.nm{display:block;font-size:12px;color:var(--ink2);font-weight:700;letter-spacing:.02em}
.acct{font-size:10px;background:var(--soft);color:var(--ink2);border-radius:8px;padding:1px 7px;font-weight:700;margin-left:5px;white-space:nowrap}
.amt{display:block;font-size:20px;font-weight:500;margin-top:1px}
.amt small{font-family:'Nunito',sans-serif;font-size:12px;color:var(--ink2);font-weight:600}
.bar{display:block;height:9px;border-radius:9px;background:var(--soft);margin:7px 8px 0;overflow:hidden}
.bar i{display:block;height:100%;border-radius:9px;background:var(--c,var(--accent));transition:width .8s cubic-bezier(.3,1.4,.5,1)}
.sub{display:block;font-size:12px;color:var(--ink2);margin-top:4px;font-weight:600}
.sub.warn{color:var(--warn)}
.edit{position:absolute;top:8px;left:10px;font-size:11px;color:var(--ink2);opacity:0;transition:opacity .2s;font-weight:700}
.pal:hover .edit,.pal:focus-visible .edit{opacity:1}
.say{position:absolute;left:50%;top:-6px;transform:translate(-50%,-100%) scale(.6);opacity:0;pointer-events:none;background:var(--bub);border:2px solid var(--bubline);color:var(--bubink);border-radius:14px;padding:5px 11px;font-size:12px;font-weight:800;white-space:nowrap;z-index:6;transition:opacity .25s,transform .35s cubic-bezier(.3,1.6,.5,1)}
.say.show{opacity:1;transform:translate(-50%,-100%) scale(1)}
.blink{transform-box:fill-box;transform-origin:center;animation:bl 4.2s infinite}
@keyframes bl{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}
.pup{transition:transform .55s ease}
.float{animation:fl 3.2s ease-in-out infinite}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.fc{animation:bob 3.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes bob{0%,100%{transform:translate(0,0)}35%{transform:translate(2px,-5px)}70%{transform:translate(-2px,-2px)}}
.sway{animation:sw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes sw{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
.tw{animation:tw 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes tw{0%,100%{transform:scale(.4);opacity:.3}50%{transform:scale(1.15);opacity:1}}
.flame{animation:fk .35s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 0}
@keyframes fk{from{transform:scaleY(.8)}to{transform:scaleY(1.2)}}
.nofloat .float,.nofloat .fc,.nofloat .sway{animation:none}
@media (prefers-reduced-motion:reduce){.float,.fc,.blink,.tw,.flame,.sway,.pal.hop,.stk.pop{animation:none}.pup{transition:none}}
.stickers{display:flex;flex-wrap:wrap;gap:8px}
.stk{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:6px 13px 6px 9px;font-size:13px;font-weight:800;border:2px solid var(--gold);background:var(--panel)}
.stk{color:var(--ink);cursor:pointer;font-family:inherit;line-height:1.2}
.stk .ico{font-size:17px;line-height:1}
.stk.lock .ico{filter:grayscale(1);opacity:.5}
.stk small{font-weight:600;opacity:.8}
.stk.add{border:2px dashed var(--line);color:var(--ink2);padding:6px 14px;font-weight:700}
.stk.pop{animation:stkpop .9s cubic-bezier(.3,1.6,.5,1)}
@keyframes stkpop{0%{transform:scale(.6) rotate(-8deg)}50%{transform:scale(1.25) rotate(5deg)}100%{transform:none}}
.hint{font-size:12px;color:var(--ink2);font-weight:600}
.emo{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.emo button{font-size:20px;width:38px;height:38px;border-radius:12px;border:2px solid var(--line);background:var(--bg);cursor:pointer;padding:0;line-height:1}
.emo button:hover{background:var(--soft)}
.stk.lock{border:2px dashed var(--line);color:var(--ink2);opacity:.75;font-weight:700}
.foot{margin-top:30px;color:var(--ink2);font-size:12px;text-align:center}
.modal{position:fixed;inset:0;background:rgba(20,15,30,.45);display:flex;align-items:flex-end;justify-content:center;z-index:30;padding:16px}
.modal[hidden]{display:none!important}
.sheet{background:var(--panel);border:2px solid var(--line);border-radius:26px;width:100%;max-width:440px;max-height:calc(100% - 16px);overflow:auto;padding:20px 20px 18px;box-shadow:0 20px 50px rgba(0,0,0,.25);animation:up .3s cubic-bezier(.3,1.4,.5,1)}
@keyframes up{from{transform:translateY(30px);opacity:0}}
@media(min-width:600px){.modal{align-items:center}}
.sheet h3{margin:0;font-family:'Fredoka',sans-serif;font-size:22px;font-weight:500}
.sheet .lead{margin:2px 0 14px;color:var(--ink2);font-size:13px}
.fld{display:block;margin-bottom:12px}
.fld>span:first-child{display:block;font-weight:800;font-size:13px;margin-bottom:4px}
.fld small{display:block;color:var(--ink2);font-size:12px;margin-top:3px}
.fld input,.fld select{width:100%;background:var(--bg);color:var(--ink);border:2px solid var(--line);border-radius:12px;padding:9px 12px;font:inherit;font-weight:700}
.numwrap{position:relative;display:block}
.numwrap .pre,.numwrap .suf{position:absolute;top:50%;transform:translateY(-50%);color:var(--ink2);font-weight:800}
.numwrap .pre{left:12px}.numwrap .suf{right:12px}
.numwrap input{padding-left:26px}
.numwrap.hasp input{padding-left:12px;padding-right:28px}
.act{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;flex-wrap:wrap}
.row{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-weight:700}
.row input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent)}
.err{color:var(--bad);font-weight:800;font-size:13px;min-height:18px}
.split{display:grid;grid-template-columns:1fr 130px;gap:8px;align-items:center;margin-bottom:8px}
.split label{font-weight:800;font-size:13px}
.split .fixed{font-family:'Fredoka',sans-serif;font-size:17px;text-align:right;padding-right:6px}
.layout{display:flex;flex-direction:column}
.main,.side{display:contents}
.penny{order:0}.sum{order:1}.b2{order:2}.b3{order:3}.b4{order:4}.b5{order:5}.b6{order:6}.b7{order:7}
@media(min-width:1100px){
body{padding-block:20px 36px;font-size:16px}
.wrap{max-width:1520px}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 384px;gap:0 32px;align-items:start}
.grid{gap:16px}
.main,.side{display:block}
.sh{margin:16px 0 8px}
.main .art svg{max-height:96px}
.main .pal{padding:8px 10px 12px}
.amt{font-size:19px}
.side .g2{grid-template-columns:1fr}
.side .pal{grid-template-columns:104px 1fr;text-align:left;align-items:center;gap:8px;padding:8px 14px 8px 8px}
.side .bar{margin-inline:0}
.side .art svg{max-height:84px}
.side .penny{margin:0 0 8px}.side .pennyart{width:58px}
.side .sum{grid-template-columns:1fr 1fr;margin:14px 0 4px}
.foot{margin-top:16px}
.side .sum div+div{border-left:0}
.side .sum div:nth-child(even){border-left:2px dashed var(--line)}
.side .sum div:nth-child(n+3){border-top:2px dashed var(--line)}
.ex{margin-top:10px;padding:8px 14px}
}
.moderow{display:flex;gap:8px;flex-wrap:wrap;margin:2px 0}
.moderow .btn{padding:8px 14px}
.moderow .btn[aria-pressed="true"]{box-shadow:0 0 0 3px var(--gold),0 6px 16px rgba(240,102,155,.35)}
.autonote{display:flex;gap:10px;align-items:center;background:#e9f9ef;border:2px solid #bfe6cd;border-radius:16px;padding:10px 14px;margin:0 0 12px;font-size:14px;color:var(--ink)}
.autonote b{font-weight:800}
.tplbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:2px 0 12px}
.tpllab{font-weight:800;font-size:13px;color:var(--ink2)}
.tplchip{display:inline-flex;align-items:center;gap:2px;background:var(--soft);border:2px solid var(--line);border-radius:999px;padding:2px 6px 2px 12px}
.tplchip>button{background:none;border:0;font:inherit;cursor:pointer;color:var(--ink);font-weight:800;padding:4px 6px}
.tplx{color:var(--ink2)!important;font-size:15px;line-height:1}
.tmprow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 12px}
.roadwrap{margin:14px 0 2px;border-top:2px dashed var(--line);padding-top:12px}
.roadwrap h3{font-family:'Fredoka',sans-serif;font-weight:500;font-size:17px;margin:0 0 4px}
.road{position:relative;height:44px;background:var(--soft);border:2px solid var(--line);border-radius:999px;margin:30px 8px 6px}
.road::before{content:'';position:absolute;left:12px;right:12px;top:50%;border-top:4px dashed var(--line);transform:translateY(-50%)}
.roadprog{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#ffd98a,#ffc76b);border-radius:999px;max-width:100%}
.roadcar{position:absolute;top:-26px;transform:translateX(-50%);font-size:26px;transition:left .5s}
.roadflag{position:absolute;top:-8px;transform:translateX(-50%);font-size:15px;text-align:center;line-height:1.2}
.roadflag i{display:block;font-style:normal;font-size:10px;font-weight:800;color:var(--ink2)}
.roadflag.done{opacity:.45;filter:grayscale(.5)}
.roadcaps{display:flex;justify-content:space-between;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);margin:0 8px}
.roadmiles{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:6px}
.roadmiles li{display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:700;background:var(--soft);border:2px solid var(--line);border-radius:14px;padding:8px 12px}
.wishhead{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.chapters{display:flex;flex-direction:column;gap:16px;margin-top:12px}
.chapter{background:var(--panel);border:2px solid var(--line);border-radius:24px;box-shadow:var(--shadow);padding:18px}
.chapter.ch-done{border-color:var(--gold)}
.ch-head{display:flex;gap:12px;align-items:flex-start}
.ch-icon{font-size:32px;line-height:1}
.ch-name{font-family:Fredoka,sans-serif;font-weight:500;font-size:18px}
.ch-desc{font-size:13px;opacity:.75;margin-top:2px}
.ch-pct{font-size:12px;opacity:.7;margin-bottom:8px}
.ch-goals{display:flex;flex-direction:column;gap:6px}
.ch-goal{display:flex;align-items:center;gap:8px;font-size:14px;padding:6px 10px;background:var(--soft);border-radius:12px}
.ch-goal.done{opacity:.85}
.ch-check{font-size:16px}
.ch-sticker{margin-left:auto;font-size:18px}
.wishgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin-top:12px}
.wishcard{position:relative;background:var(--panel);border:2px solid var(--line);border-radius:24px;box-shadow:var(--shadow);padding:16px;text-align:center}
.wemoji{font-size:44px;display:block}
.winfo b{display:block;font-family:'Fredoka',sans-serif;font-weight:500;font-size:17px;margin:6px 0 2px}
.winfo .tnum{font-size:19px;font-weight:800;color:var(--ink2)}
.wbtns{display:flex;gap:8px;justify-content:center;margin-top:10px;flex-wrap:wrap}
.wx{position:absolute;top:8px;right:10px}
.wempty{text-align:center;padding:34px 16px;color:var(--ink2);font-weight:700}
.wempty .big{font-size:52px;display:block;margin-bottom:8px}
.verd{border-radius:16px;padding:12px 14px;font-weight:700;margin:10px 0;border:2px solid var(--line)}
.verd.good{background:#e9f9ef;border-color:#9fdcb4}
.verd.warn{background:#fff6e0;border-color:#f0d48a}
:root[data-t="dark"] .verd.good{background:#123324;border-color:#2c6b4a}
:root[data-t="dark"] .verd.warn{background:#3a2f10;border-color:#8a6f2c}
.wishbig{font-size:56px;text-align:center;display:block;margin:4px 0}
.wraphero{background:linear-gradient(135deg,#ffb3d9,#c4a5f5 55%,#9fd8ff);border:2px solid var(--line);border-radius:26px;box-shadow:var(--shadow);padding:26px 22px;color:#3a2340;text-align:center;margin-bottom:14px}

el.style.display='flex';
el.innerHTML='<span class="tpllab">⚡ Quick feed</span>'+S.payTemplates.map(function(t){return '<button type="button" class="btn ghost small" data-qf="'+t.id+'">'+esc(t.name)+'</button>'}).join('');
}
function quickFeed(t){
var fd=feedDest();
var rows=t.alloc.map(function(a,i){return a>0?'<div class="split"><label>'+esc(fd[i][1])+'</label><div class="fixed tnum">'+fmt(a)+'</div></div>':''}).join('');
var body='<label class="fld" for="qf_amt"><span>Paycheck amount</span><span class="numwrap"><span class="pre">$</span><input id="qf_amt" type="number" inputmode="decimal" step="any" min="0" value="'+S.pay.amount+'"></span></label>'+(rows||'<p class="lead">This template is empty.</p>')+'<p class="lead" style="margin:8px 0 0">Anything left over goes to '+esc(S.jars[0].name)+'.</p>';
openModal({title:'⚡ '+t.name,lead:'One-tap payday. Confirm and everyone gets fed.',body:body,saveLabel:'Feed them!',
onSave:function(){
var amt=parseFloat($('#qf_amt').value)||0,amts=t.alloc.slice(),sum=amts.reduce(function(x,y){return x+y},0),left=amt-sum;
if(left<0){$('#mErr').textContent='That adds up to more than your paycheck.';return false}
amts[0]+=left;
applyFeed(amt,amts);
}});
}
$('#feed').addEventListener('click',function(){
var dest=feedDest();
var body='<label class="fld" for="fd_amt"><span>Paycheck amount</span><span class="numwrap"><span class="pre">$</span><input id="fd_amt" type="number" inputmode="decimal" step="any" min="0" value="'+S.pay.amount+'"></span></label><div class="tplbar" id="tplbar"></div><p class="lead" style="margin:0 0 8px">Where should it go? Your pals get less hungry as they are fed.</p>'+
dest.map(function(d,i){return '<div class="split"><label for="fd'+i+'">'+esc(d[1])+'</label><span class="numwrap"><span class="pre">$</span><input id="fd'+i+'" type="number" inputmode="decimal" step="any" min="0" value="0"></span></div>'}).join('')+
'<div class="split"><label for="fdRest">Everything else goes to</label><select id="fdRest" style="width:100%;background:var(--bg);color:var(--ink);border:2px solid var(--line);border-radius:12px;padding:9px 12px;font:inherit;font-weight:700">'+S.jars.map(function(j,i){return '<option value="'+i+'">'+esc(j.name)+'</option>'}).join('')+'</select></div>'+
'<div class="split"><label>That leaves</label><div class="fixed tnum" id="fdLeft"></div></div>';
openModal({title:'Feed the pals',lead:'Split your paycheck and watch everyone cheer.',body:body,saveLabel:'Feed them!',
onOpen:function(){refreshTplBar();var upd=function(){var a=parseFloat($('#fd_amt').value)||0,s=0;dest.forEach(function(d,i){s+=parseFloat($('#fd'+i).value)||0});var l=a-s;$('#fdLeft').textContent=fmt(l);$('#mErr').textContent=l<0?'That adds up to more than your paycheck.':''};$$('#mBody input').forEach(function(i){i.addEventListener('input',upd)});upd()},
onSave:function(){
var a=parseFloat($('#fd_amt').value)||0,amts=dest.map(function(d,i){return Math.max(0,parseFloat($('#fd'+i).value)||0)}),s=amts.reduce(function(x,y){return x+y},0),left=a-s;
if(left<0){$('#mErr').textContent='That adds up to more than your paycheck.';return false}
var rest=+$('#fdRest').value;amts[rest]+=left;
applyFeed(a,amts);
}});
});
var lastNote='';
$('#openSettings').addEventListener('click',function(){
var fx=S.fx;
var autoHtml='';
if(autoNote){autoHtml='<details class="autosum"><summary>🤖 Autopilot activity</summary><p>Fed '+pl(autoNote.n,'paycheck')+': '+fmt(autoNote.b)+' → '+esc(S.jars[1]?S.jars[1].name:'Bills')+', '+fmt(autoNote.h)+' → HYSA'+(autoNote.k>0?', '+fmt(autoNote.k)+' → 401k':'')+'.</p></details>';}
else if(S.pay.auto){autoHtml='<details class="autosum"><summary>🤖 Autopilot activity</summary><p>Autopilot is on — no new paydays since you last opened the app.</p></details>';}
var body=autoHtml+'<label class="fld" for="s_name"><span>Your name</span><input id="s_name" type="text" maxlength="20" value="'+esc(S.name)+'"></label>'+
[['rain','Money rain in the background'],['burst','Coin and heart bursts'],['float','Gentle floating and bobbing'],['gaze','Pals look around at each other']].map(function(r){return '<label class="row"><input type="checkbox" id="s_'+r[0]+'"'+(fx[r[0]]?' checked':'')+'> '+r[1]+'</label>'}).join('')+
'<p class="lead" style="margin:12px 0 6px">Costume closet</p><div class="moderow" id="modeRow">'+[['classic','\u{1F308}','Classic'],['spooky','\u{1F383}','Spooky'],['princess','\u{1F451}','Princess']].map(function(m){return '<button type="button" class="btn ghost" data-mode="'+m[0]+'" aria-pressed="'+String(S.mode===m[0])+'">'+m[1]+' '+m[2]+'</button>'}).join('')+'</div>'+
'<p class="lead" style="margin:12px 0 6px">Backup</p><div class="act" style="justify-content:flex-start;margin:0"><button class="btn ghost" id="s_exp" type="button">Save a backup</button><label class="btn ghost" for="s_imp" style="cursor:pointer">Restore backup</label><input id="s_imp" type="file" accept=".json,application/json" hidden></div><p class="lead" style="margin:6px 0 0" id="s_note"></p>'+
'<p class="lead" style="margin:12px 0 6px">Share with Little Friend</p><div class="act" style="justify-content:flex-start;margin:0"><button class="btn ghost" id="s_copy" type="button">Copy summary</button></div><p class="lead" style="margin:6px 0 0" id="s_copynote">Copies your key numbers so you can paste them to Little Friend for a checkup.</p>'+
'<p class="lead" style="margin:12px 0 6px">Start over</p><button class="btn ghost" id="s_reset" type="button">Clear all my numbers</button>';
openModal({title:'Settings',lead:'Tune the pals, your look, and their costumes.',body:body,saveLabel:'Done',
onOpen:function(){
$$('#modeRow [data-mode]').forEach(function(b){b.addEventListener('click',function(){S.mode=b.getAttribute('data-mode');save();render();$$('#modeRow [data-mode]').forEach(function(x){x.setAttribute('aria-pressed',String(x===b))})})});
$('#s_exp').addEventListener('click',function(){
try{
var blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='money-pals-backup.json';
document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},400);
$('#s_note').textContent='Backup saved.';
}catch(e){$('#s_note').textContent='Could not save a backup here.'}
});
$('#s_copy').addEventListener('click',function(){copySummary(function(ok){$('#s_copynote').textContent=ok?'Copied! Paste it to Little Friend.':'Copy failed — try again.'})});
$('#s_imp').addEventListener('change',function(){var f=this.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{var p=JSON.parse(r.result);if(!p||!p.jars||!p.cards||!p.pay)throw 0;S=Object.assign(defaults(),p);S.example=false;save();render();closeModal()}catch(e){$('#s_note').textContent='That file does not look like a Money Pals backup.'}};r.readAsText(f)});
var rs=$('#s_reset');rs.addEventListener('click',function(){if(rs.dataset.sure){S=blank(S);save();render();closeModal();penny()}else{rs.dataset.sure='1';rs.textContent='Tap again to clear everything'}});
},
onSave:function(){S.name=$('#s_name').value.trim()||'friend';['rain','burst','float','gaze'].forEach(function(k){S.fx[k]=$('#s_'+k).checked});save();render();start()}});
});
$('#clearEx').addEventListener('click',function(){S=blank(S);save();render();penny()});
function setTheme(th){S.theme=th;save();render()}
$('#tools').addEventListener('click',function(e){var d=e.target.closest('#darkBtn');if(!d)return;setTheme(S.theme==='dark'?'light':'dark');var r=d.getBoundingClientRect();burst(r.left+20,r.top+14,'spark',10)});
autoPilot();render();penny();start();
})();
</script>
</body></html>
