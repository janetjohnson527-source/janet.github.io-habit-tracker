<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Janet's Mind Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#3b1f1f; --paper:#fbf6ea; --grid:#ebe2d0;
  --blue:#2f6bea; --teal:#1fb59a; --pink:#f7a1c4; --red:#ef4d3c; --yellow:#ffb627; --lilac:#9b7cf0; --mint:#7fd8b8; --peach:#ffb38a;
  --muted:#7a5a52;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background-color:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px;color:var(--tx,var(--ink));font-family:var(--fb,Poppins),system-ui,sans-serif;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:1500px;margin:0 auto;padding:22px 32px 90px}

/* title */
.titlebox{position:relative;text-align:center;margin:6px 0 4px}
.ttl{font-family:var(--fh,Poppins);font-weight:900;font-size:52px;line-height:1;letter-spacing:-.01em;color:var(--yellow);-webkit-text-stroke:5px var(--ink);paint-order:stroke fill;text-shadow:5px 5px 0 var(--red);margin:0}
.sub{font-weight:800;font-size:12px;margin-top:10px}
.themepill{position:fixed;top:14px;right:16px;z-index:55;color:var(--ink);cursor:pointer;display:flex;gap:6px;align-items:center;background:#fff;border:2px solid var(--ink);border-radius:999px;padding:4px 10px 4px 4px;box-shadow:2px 2px 0 var(--ink);font-size:11px;font-weight:800}
.themepill i{width:20px;height:20px;border-radius:50%;background:var(--sw);border:2px solid var(--ink)}
.tmenu{position:fixed;top:50px;right:16px;z-index:56;background:#fff;color:#3b1f1f;border:2.5px solid #3b1f1f;border-radius:16px;box-shadow:4px 4px 0 #3b1f1f;padding:8px;display:none;max-height:70vh;overflow:auto;min-width:200px}
.tmenu.open{display:block}
.tmenu button{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;border-radius:10px;padding:7px 10px;font:700 13px Poppins,system-ui,sans-serif;color:#3b1f1f;text-align:left}
.tmenu button:hover,.tmenu button.on{background:#f3ead8}
.tmenu i{width:22px;height:22px;border-radius:50%;border:2px solid #3b1f1f;flex:none}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:18px 0 22px}
.chip{background:#fff;border:2px solid var(--ink);border-radius:999px;padding:5px 14px;font-weight:800;font-size:11px;letter-spacing:.03em;text-transform:uppercase;box-shadow:2px 2px 0 var(--ink);transition:transform .15s}
.chip:hover{transform:translate(-1px,-1px)}
.chip.on{background:var(--yellow)}

/* folder cards */
.map{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:26px 22px}
@media(max-width:1150px){.map{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:820px){.map{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:540px){.map{grid-template-columns:1fr}.ttl{font-size:36px}
.cal{gap:3px;font-size:11px}.cal .d{padding:4px 3px;min-height:52px;border-radius:7px}.cal .d small{font-size:9px}.cal .hd{padding:2px;font-size:10px}
.bars{gap:3px}.bars div{font-size:9px}
.cal .d .ev{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:8.5px;padding:1px 3px;margin-top:3px}}
.folder{position:relative;text-align:left;background:none;border:0;padding:16px 0 0;display:block;width:100%;animation:pop .5s cubic-bezier(.2,1.4,.4,1) both}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.97)}}
.folder .tab{position:absolute;left:0;top:0;height:22px;width:46%;background:var(--d);border:2.5px solid var(--ink);border-bottom:0;border-radius:8px 14px 0 0}
.folder .body{position:relative;background:var(--c);border:2.5px solid var(--ink);border-radius:0 12px 12px 12px;box-shadow:5px 5px 0 var(--ink);padding:14px 16px 14px;min-height:214px;display:flex;flex-direction:column;transition:transform .2s cubic-bezier(.3,1.5,.5,1),box-shadow .2s}
.folder:hover .body,.folder:focus-visible .body{transform:translate(-2px,-3px);box-shadow:7px 8px 0 var(--ink)}
.folder:focus-visible{outline:none}
.folder .head{display:flex;align-items:center;gap:8px}
.folder .name{font-family:var(--fh,Poppins);font-weight:900;font-size:18px;line-height:1.05}
.folder .pill{margin-left:auto;font-size:10px;font-weight:800;background:#fff;border:2px solid var(--ink);border-radius:999px;padding:2px 8px;white-space:nowrap}
.folder .metric{display:flex;align-items:baseline;gap:8px;margin:10px 0 2px}
.folder .num{font-family:var(--fh,Poppins);font-weight:900;font-size:34px;line-height:1;color:#fff;-webkit-text-stroke:4px var(--ink);paint-order:stroke fill}
.folder .unit{font-weight:800;font-size:12px}
.folder .bar{height:9px;background:#fff;border:2px solid var(--ink);border-radius:999px;overflow:hidden;margin:6px 0 8px}
.folder .bar i{display:block;height:100%;background:var(--ink)}
.folder ul{list-style:none;margin:0;padding:0;font-size:12.5px;line-height:1.4}
.folder li{padding:5px 0;border-top:2px dashed rgba(59,31,31,.25);display:flex;gap:7px}
.folder li:first-child{border-top:0}
.folder li .bx{flex:none;width:13px;height:13px;margin-top:2px;border:2px solid var(--ink);border-radius:4px;background:#fff}
.folder li .bx.done{background:var(--ink)}
.folder .next{margin-top:auto;padding-top:10px}
.folder .next span{display:inline-block;background:#fff;border:2px solid var(--ink);border-radius:999px;padding:3px 11px;font-weight:800;font-size:11.5px}
.folder.hide{display:none}
.folder.ext .name::after{content:" ↗";font-size:14px}

/* corner key */
.key{position:fixed;right:12px;bottom:12px;z-index:30;display:flex;gap:8px}
.key button{background:var(--pink);border:2px solid var(--ink);border-radius:999px;padding:4px 10px;font-weight:800;font-size:11px;box-shadow:2px 2px 0 var(--ink)}
.key button:nth-child(2){background:var(--yellow)}

/* sparkles */
.spk{position:fixed;pointer-events:none;z-index:0}
.spk path{stroke:var(--ink);stroke-width:1.6}
.tw{animation:tw 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes tw{0%,100%{transform:scale(.7)}50%{transform:scale(1.15)}}

/* drawer */
.drawer{position:fixed;inset:0;z-index:40;overflow:auto;background:transparent;display:none}
body.dopen .wrap,body.dopen .key{visibility:hidden}
.wrap{position:relative;z-index:1}
#deco{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#deco svg{position:absolute}
.drawer.open{display:block;animation:slide .3s ease-out}
@keyframes slide{from{opacity:0;transform:translateY(16px)}}
.dwrap{max-width:1300px;margin:0 auto;padding:22px 32px 80px}
.back{background:#fff;border:2.5px solid var(--ink);border-radius:999px;padding:6px 14px;font-weight:800;font-size:12px;box-shadow:3px 3px 0 var(--ink)}
.dtitle{display:flex;align-items:center;gap:14px;margin:16px 0 4px}
.dtitle h1{margin:0;font-family:var(--fh,Poppins);font-weight:900;font-size:40px;line-height:1;color:var(--c,var(--yellow));-webkit-text-stroke:5px var(--ink);paint-order:stroke fill;text-shadow:4px 4px 0 var(--ink)}
.dsub{font-size:13px;color:var(--muted);font-weight:600;margin:6px 0 18px;max-width:780px}
.panel{background:#fff;border:2.5px solid var(--ink);border-radius:16px;box-shadow:5px 5px 0 var(--ink);padding:16px 18px;margin-bottom:20px}
.panel h2{margin:0 0 10px;font-family:var(--fh,Poppins);font-weight:900;font-size:19px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px;align-items:start}
.row{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:2px dashed rgba(59,31,31,.2);font-size:14px}
.row:first-of-type{border-top:0}
.row .t{flex:1}
.row .t small{display:block;color:var(--muted);font-weight:600;font-size:12px}
.row.done .t>span{text-decoration:line-through;opacity:.55}
.ck{flex:none;width:24px;height:24px;border-radius:7px;border:2.5px solid var(--ink);background:#fff;display:grid;place-items:center;font-weight:900;font-size:14px;padding:0}
.ck.on{background:var(--hc,var(--ink));color:#fff}
.x{flex:none;background:none;border:0;font-size:16px;opacity:.35;padding:2px 6px}
.x:hover{opacity:1}
.add{display:flex;gap:8px;margin-top:10px}
.add input,.field{flex:1;font:inherit;font-size:13px;border:2.5px solid var(--ink);border-radius:999px;padding:7px 14px;background:var(--paper);color:var(--ink);min-width:0}
textarea.field{border-radius:14px;min-height:110px;resize:vertical;width:100%}
.btn{background:var(--yellow);border:2.5px solid var(--ink);border-radius:999px;padding:6px 14px;font-weight:800;font-size:12px;box-shadow:2px 2px 0 var(--ink);white-space:nowrap}
.btn.pink{background:var(--pink)}.btn.teal{background:var(--teal);color:#fff}.btn.white{background:#fff}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.hpick .chip{text-transform:none;letter-spacing:0;font-size:12px}
.tabs .chip.on{background:var(--c,var(--yellow))}
.big{font-family:var(--fh,Poppins);font-weight:900;font-size:40px;line-height:1;color:var(--tx,var(--ink));-webkit-text-stroke:0;text-shadow:2px 2px 0 color-mix(in srgb,var(--c,#ffb627) 55%,transparent)}
.panel .big,.bigrow .big{color:inherit;font-size:34px;font-weight:900;letter-spacing:-.01em}
[data-theme="sampler"] .bigrow .big{font-family:var(--fb,monospace)}
.bigrow{display:flex;align-items:baseline;gap:10px;margin-bottom:6px}
.bigrow span{font-weight:800;font-size:13px}
.pbar{height:12px;background:var(--paper);border:2.5px solid var(--ink);border-radius:999px;overflow:hidden;margin:6px 0 12px}
.pbar i{display:block;height:100%;background:var(--c,var(--teal))}
.note{font-size:12px;color:var(--muted);font-weight:600;margin-top:8px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;font-size:12px}
.cal .d{min-width:0}
.cal .d *{max-width:100%}
.cal .hd{font-weight:800;text-align:center;padding:4px;font-size:11px}
.cal .d{border:2px solid var(--ink);border-radius:10px;padding:6px;min-height:64px;background:#fff;font-weight:700}
.cal .d small{display:block;font-weight:600;font-size:10.5px;line-height:1.3}
.cal .d.today{box-shadow:inset 0 0 0 3px var(--ink)}
.cal .d.empty{border:0;background:none}
.cal .d.dim{opacity:.4}
.dots{display:flex;flex-wrap:wrap;gap:2px;margin-top:3px}.dots i{width:8px;height:8px;border-radius:50%}
.ev{display:inline-block;background:#fff;border:2px solid var(--ink);border-radius:999px;padding:1px 7px;font-size:10px;font-weight:800;margin-top:3px}
.bars{display:flex;gap:8px;align-items:flex-end;height:170px;margin-top:10px}
.bars div{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;text-align:center;font-size:11px;font-weight:700;height:100%}
.bars i{display:block;background:var(--c,var(--teal));border:2px solid var(--ink);border-radius:8px 8px 0 0;margin-bottom:4px;min-height:2px}
.vcard{background:var(--paper);border:2.5px solid var(--ink);border-radius:14px;padding:12px;font-size:13px}
.vcard b{display:block;font-size:14px;margin-bottom:4px}
.item{background:#fff;border:2.5px solid var(--ink);border-radius:14px;padding:12px;box-shadow:3px 3px 0 var(--ink)}
.item b{font-size:14px}.item .spec{font-size:12.5px;color:var(--muted);font-weight:600;margin:4px 0 8px;line-height:1.4}
.slot{display:grid;place-items:center;border:2.5px dashed var(--ink);border-radius:10px;min-height:90px;background:var(--paper);font-size:12px;font-weight:700;cursor:pointer;overflow:hidden;position:relative}
.slot img{width:100%;height:140px;object-fit:cover;display:block}
.status{display:flex;gap:6px;margin-top:8px}
.status button{flex:1;background:#fff;border:2px solid var(--ink);border-radius:999px;padding:2px 0;font-size:11px;font-weight:800}
.status button.on{background:var(--c,var(--yellow))}
.ring{width:240px;height:240px;display:block;margin:0 auto}
.phase{display:inline-block;border:2px solid var(--ink);border-radius:999px;padding:3px 11px;font-weight:800;font-size:12px;margin:3px}
.callout{border:2.5px solid var(--ink);border-radius:14px;padding:12px 14px;font-size:13.5px;line-height:1.5;margin-top:10px}
.modal{position:fixed;inset:0;z-index:60;background:rgba(59,31,31,.35);display:none;align-items:center;justify-content:center;padding:20px}
.modal.open{display:flex}
.modal .panel{width:min(560px,100%);margin:0}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:999px;padding:8px 16px;font-weight:700;font-size:13px;z-index:80;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.helper{position:fixed;left:16px;bottom:16px;z-index:50;width:min(340px,calc(100vw - 32px));background:#fff;border:2.5px solid var(--ink);border-radius:16px;box-shadow:4px 4px 0 var(--ink);font-size:13px;animation:hpop .35s cubic-bezier(.2,1.4,.4,1) both}
@keyframes hpop{from{opacity:0;transform:translateY(10px) scale(.96)}}
.helper .hh{display:flex;align-items:center;gap:8px;padding:8px 10px 6px 12px;font-weight:900;font-size:12px;letter-spacing:.04em}
.helper .hh .star{display:inline-block;width:18px;height:18px;border-radius:50%;background:var(--yellow);border:2px solid var(--ink);display:grid;place-items:center;font-size:10px}
.helper .hh button{margin-left:auto;background:none;border:0;font-weight:900;font-size:14px;padding:0 4px}
.helper .tip{display:flex;gap:8px;align-items:flex-start;padding:7px 12px;border-top:2px dashed rgba(59,31,31,.2);line-height:1.4}
.helper .tip .ic{flex:none;width:22px;text-align:center}
.helper .tip a,.helper .tip .go{background:none;border:0;padding:0;font-weight:800;text-decoration:underline;color:var(--ink);cursor:pointer;font-size:12.5px}
.helper.mini{width:auto;border-radius:999px}
.helper.mini .tip{display:none}
.helper.mini .hh{padding:5px 8px 5px 6px}


/* ===== scene homes ===== */
#scene{position:fixed;inset:0;z-index:2;display:none;align-items:center;justify-content:center;overflow:hidden}
html.scene-on #scene{display:flex}
html.scene-on .wrap,html.scene-on .key{display:none}
html.scene-on #deco{display:none}
html.scene-on body.dopen #deco{display:block}
body.dopen #scene{display:none!important}
body.dopen #sceneBar,body.dopen #sceneWeb,body.dopen #sceneKey{display:none!important}
#sceneInner{position:relative;z-index:1;width:640px;height:440px;flex:none;transform-origin:center center}
.sext{position:absolute;left:0;top:0;width:640px;height:440px;transform-origin:0 0;pointer-events:none;display:none;z-index:0;overflow:hidden}
.sext.notext *{color:transparent!important;text-shadow:none!important;-webkit-text-stroke:0!important}.sext.notext text{display:none}
#sceneOvl{position:absolute;left:0;top:0;height:440px;transform-origin:0 0;pointer-events:none;display:none;z-index:3}
html.sovl-strange #sceneInner .sts-flicker>svg>g[stroke="#e8e8e8"],html.sovl-strange #sceneInner .sts-drop{visibility:hidden}
#sceneInner .sts-flicker{animation:none!important}
.sc-web{display:none}
#sceneInner svg:has(#hhs-hg){display:none}
[data-theme="haunted"] #sceneInner>div{background:transparent!important;overflow:visible!important}
#sceneGrain{position:absolute;inset:0;width:100%;height:100%;opacity:.25;mix-blend-mode:overlay;pointer-events:none;z-index:3}
#sceneFence{position:absolute;right:0;pointer-events:none;display:none}
#sceneWeb{position:absolute;top:0;right:0;pointer-events:none}
.sc-hot{position:absolute;background:transparent;border:0;border-radius:10px;cursor:pointer;padding:0;transition:box-shadow .2s}
.sc-hot:hover,.sc-hot:focus-visible{outline:none;box-shadow:0 0 0 2px rgba(255,236,170,.95),0 0 22px rgba(255,220,120,.75)}
.sc-lab{cursor:pointer;transition:filter .2s}
button.sc-lab{font-family:inherit}
.sc-lab:hover,.sc-lab:focus-visible{filter:drop-shadow(0 0 5px rgba(255,255,255,.95)) drop-shadow(0 0 12px rgba(255,220,120,.7));outline:none}
#sceneMore{position:fixed;top:14px;right:170px;z-index:55;display:none;background:#fff;border:2px solid #3b1f1f;border-radius:999px;padding:4px 12px;font:800 11px Poppins,system-ui,sans-serif;color:#3b1f1f;box-shadow:2px 2px 0 #3b1f1f;cursor:pointer}
body.dopen #sceneKey,body.dopen #sceneMore{display:none!important}
#sceneInner *{pointer-events:none!important}
#sceneInner [data-k],#sceneInner [data-k] *,#sceneInner [data-act],#sceneInner [data-act] *{pointer-events:auto!important}
#sceneInner text[data-k],#sceneInner text[data-k] *{pointer-events:bounding-box!important}
#sceneKey{position:fixed;left:14px;top:14px;z-index:55;display:none;gap:6px}
#sceneKey button{background:#fff;border:2px solid #3b1f1f;border-radius:999px;padding:4px 10px;font:800 11px Poppins,system-ui,sans-serif;color:#3b1f1f;box-shadow:2px 2px 0 #3b1f1f;cursor:pointer}
.morelist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.morelist button{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--c);border:2px solid #3b1f1f;border-radius:12px;padding:8px 12px;font-weight:800;font-size:13px;color:#3b1f1f;text-align:left}
.morelist button small{font-weight:700;font-size:11px;opacity:.75;white-space:nowrap}
/* ================= THEMES ================= */
.helper,.modal .panel,.panel{color:var(--ink)}
.modal .panel,.helper{font-family:var(--fb,Poppins),system-ui,sans-serif}
.panel .note,.panel small,.panel .spec,.modal .note{color:#7a5a52!important}
.panel .row small{color:#7a5a52}

html:not([data-theme="folders"]) .fo-only{display:none}
/* ---- Haunted House ---- */
[data-theme="haunted"]{--ink:#141218;--tx:#f7e3b5;--paper:#fff7e6;--muted:#c9b98f;--fh:'Chewy',cursive;--fb:'Fredoka',sans-serif;--yellow:#f2b733;--pink:#f08cb8}
[data-theme="haunted"] body{background:#141218}
[data-theme="haunted"] .ttl{color:#f2b733;-webkit-text-stroke:0;text-shadow:3px 3px 0 #f2622e,6px 6px 0 #a35fb5;font-weight:400;letter-spacing:.02em}
[data-theme="haunted"] .sub{color:#8cc7a6}
[data-theme="haunted"] .folder{padding-top:24px}
[data-theme="haunted"] .folder .tab{height:30px;width:58%;left:6%;border:0;border-radius:0;background:var(--ink);clip-path:polygon(50% 0,100% 100%,0 100%)}
[data-theme="haunted"] .folder .tab::after{content:"";position:absolute;inset:3px 5px 0;background:var(--d);clip-path:polygon(50% 0,100% 100%,0 100%)}
[data-theme="haunted"] .folder .body{border-radius:6px;box-shadow:5px 5px 0 #000;color:#141218;background-image:repeating-linear-gradient(0deg,transparent 0 11px,rgba(20,18,24,.12) 11px 12px)}
[data-theme="haunted"] .folder:hover .body{box-shadow:0 0 0 3px #f2b733,0 0 26px rgba(242,183,51,.55)}
[data-theme="haunted"] .folder .name,[data-theme="haunted"] .folder .num{font-weight:400}
[data-theme="haunted"] .chip{background:transparent;color:#f7e3b5;border-color:#f7e3b5;box-shadow:none}
[data-theme="haunted"] .chip.on{background:#f2b733;color:#141218;border-color:#f2b733}
[data-theme="haunted"] .dtitle h1{-webkit-text-stroke:0;text-shadow:3px 3px 0 #a35fb5;font-weight:400}
[data-theme="haunted"] .panel{color:#141218;background:#fff7e6;box-shadow:5px 5px 0 #000}
[data-theme="haunted"] .back{color:#141218}
[data-theme="haunted"] .key button{color:#141218}
/* ---- Pink House ---- */
[data-theme="pink"]{--ink:#3a1d4a;--tx:#fff4f8;--paper:#fff4f8;--muted:#ffe0ee;--fh:'Chewy',cursive;--fb:'Fredoka',sans-serif;--yellow:#ffe48a;--pink:#ff3f8e}
[data-theme="pink"] body{background:linear-gradient(180deg,#7b4fd0 0%,#b16ad8 45%,#ff9ac8 100%) fixed}
[data-theme="pink"] .ttl{color:#fff4f8;-webkit-text-stroke:0;text-shadow:3px 3px 0 #ff3f8e,6px 6px 0 #3a1d4a;font-weight:400}
[data-theme="pink"] .sub{color:#fff4f8}
[data-theme="pink"] .folder{padding-top:26px}
[data-theme="pink"] .folder .tab{height:32px;width:60%;left:5%;border:0;border-radius:0;background:#3a1d4a;clip-path:polygon(50% 0,100% 100%,0 100%)}
[data-theme="pink"] .folder .tab::after{content:"";position:absolute;inset:3px 5px 0;background:repeating-linear-gradient(0deg,var(--d) 0 5px,rgba(255,255,255,.35) 5px 6px);clip-path:polygon(50% 0,100% 100%,0 100%)}

/* ===== drawer artwork pulled from each theme's home scene ===== */
.dwrap{position:relative}
.dart{position:relative;overflow:hidden;pointer-events:none;flex:none}
.dart>div{position:absolute;left:0;top:0;width:640px;height:440px;transform-origin:0 0}
.dart.fade{-webkit-mask-image:linear-gradient(90deg,transparent,#000 9%,#000 91%,transparent),linear-gradient(transparent,#000 9%,#000 91%,transparent);-webkit-mask-composite:source-in;mask-image:linear-gradient(90deg,transparent,#000 9%,#000 91%,transparent),linear-gradient(transparent,#000 9%,#000 91%,transparent);mask-composite:intersect}
.dart:not(.frame)>div>:first-child{background:transparent!important;box-shadow:none!important}
.dart-measure *,.dart.iso *{animation-play-state:paused!important;transition:none!important}
.dart.iso>div,.dart.iso>div *:not([data-dv]){filter:none!important;backdrop-filter:none!important;mix-blend-mode:normal!important;background:transparent!important;box-shadow:none!important}
.dart.iso>div *{visibility:hidden!important}.dart.iso>div [data-dv],.dart.iso>div [data-dv] *{visibility:visible!important}
.dart.iso defs,.dart.iso defs *,.dart.iso pattern *,.dart.iso clipPath *,.dart.iso mask *,.dart.iso symbol *{visibility:visible!important}
.dart.frame{border:3px solid var(--ink);border-radius:16px;box-shadow:4px 4px 0 var(--ink)}
.dart-h{position:absolute;right:32px;z-index:0}
.dart-t{align-self:center}
.dwrap.has-art>:not(.dart-h):not(.helper){position:relative;z-index:1}
.dwrap.has-art .dsub{max-width:min(780px,calc(100% - 360px))}
@media(max-width:900px){.dart-h{display:none}.dwrap.has-art .dsub{max-width:780px}}

#sceneInner [data-act="more"],#sceneInner [data-act="dump"],#sceneInner [data-act="where"]{position:relative;z-index:40}

/* ===== top-right pills (theme / wrapped / stars / cheers) match each theme ===== */
[data-theme="folders"]{--pbg:#fff3d1;--pfg:#3b1f1f;--pbd:2px solid #3b1f1f;--psh:2px 2px 0 #3b1f1f;--pff:'Poppins';--prad:999px;--ptt:none;--pls:0;--pdot:#ef4d3c}
[data-theme="chromatic"]{--pbg:#faf8f4;--pfg:#141414;--pbd:1px solid #141414;--psh:none;--pff:'JetBrains Mono';--prad:999px;--ptt:uppercase;--pls:.06em;--pdot:#c64bd1}
[data-theme="strange"]{--pbg:#e9e6de;--pfg:#0f0f0f;--pbd:1.5px solid #0f0f0f;--psh:2px 2px 0 #0f0f0f;--pff:'IM Fell English';--prad:2px;--ptt:none;--pls:0;--pdot:#0f0f0f}
[data-theme="departure"]{--pbg:#f3e6cc;--pfg:#0f2c58;--pbd:1.5px solid #0f2c58;--psh:0 3px 8px rgba(0,0,0,.25);--pff:'JetBrains Mono';--prad:6px;--ptt:uppercase;--pls:.08em;--pdot:#d6402b}
[data-theme="psych"]{--pbg:#f3e6cf;--pfg:#2a2420;--pbd:2px solid #2a2420;--psh:2px 2px 0 #e8402a;--pff:'Fredoka';--prad:999px;--ptt:none;--pls:0;--pdot:#e8402a}
[data-theme="lava"]{--pbg:rgba(20,12,34,.85);--pfg:#f4ecff;--pbd:1px solid rgba(244,236,255,.4);--psh:0 0 14px rgba(255,90,217,.3);--pff:'Space Grotesk';--prad:999px;--ptt:none;--pls:0;--pdot:#ff5ad9}
[data-theme="neo"]{--pbg:#ffffff;--pfg:#111111;--pbd:3px solid #111111;--psh:3px 3px 0 #111111;--pff:'Rubik';--prad:8px;--ptt:none;--pls:0;--pdot:#9bd12a}
[data-theme="satellite"]{--pbg:#fde4e8;--pfg:#e8264a;--pbd:1.5px solid #e8264a;--psh:none;--pff:'Archivo Narrow';--prad:0;--ptt:uppercase;--pls:.08em;--pdot:#e8264a}
[data-theme="patchwork"]{--pbg:#f6ecd8;--pfg:#2b2552;--pbd:2px solid #2b2552;--psh:2px 2px 0 #f07aa8;--pff:'IM Fell English SC';--prad:4px;--ptt:none;--pls:0;--pdot:#f07aa8}
[data-theme="blackcat"]{--pbg:#fffdf8;--pfg:#111111;--pbd:2px solid #111111;--psh:none;--pff:'DM Mono';--prad:3px 7px 4px 6px;--ptt:none;--pls:0;--pdot:#111111}
[data-theme="haunted"]{--pbg:#241d31;--pfg:#f7e3b5;--pbd:2px solid #f2b733;--psh:2px 2px 0 #000;--pff:'Fredoka';--prad:999px;--ptt:none;--pls:0;--pdot:#f2b733}
[data-theme="checker"]{--pbg:#fff7ec;--pfg:#1b1714;--pbd:2px solid #1b1714;--psh:3px 3px 0 #3a6ee8;--pff:'Poppins';--prad:999px;--ptt:none;--pls:0;--pdot:#f5b800}
[data-theme="pink"]{--pbg:#fff0f6;--pfg:#3a1d4a;--pbd:2px solid #3a1d4a;--psh:2px 2px 0 #ff3f8e;--pff:'Fredoka';--prad:999px;--ptt:none;--pls:0;--pdot:#ff3f8e}
[data-theme="rainbow"]{--pbg:#161616;--pfg:#ffffff;--pbd:2px solid #ffffff;--psh:2px 2px 0 #ff7ac8;--pff:'Nunito';--prad:999px;--ptt:none;--pls:0;--pdot:#ffd21f}
[data-theme="crayon"]{--pbg:#fffdf8;--pfg:#24206a;--pbd:2.5px solid #24206a;--psh:2px 2px 0 #ff3d9a;--pff:'Gaegu';--prad:10px;--ptt:none;--pls:0;--pdot:#ff3d9a}
[data-theme="sampler"]{--pbg:#fbf3e3;--pfg:#1f4f5c;--pbd:3px solid #1f4f5c;--psh:none;--pff:'Pixelify Sans';--prad:0;--ptt:none;--pls:0;--pdot:#d9534f}
[data-theme="folk"]{--pbg:#1d2c3a;--pfg:#f3e3c8;--pbd:2px solid #f59ac0;--psh:2px 2px 0 #000;--pff:'Grandstander';--prad:999px;--ptt:none;--pls:0;--pdot:#f5c23a}
.themepill,.wrappill{background:var(--pbg,#fff)!important;color:var(--pfg,#3b1f1f)!important;border:var(--pbd,2px solid #3b1f1f)!important;box-shadow:var(--psh,2px 2px 0 #3b1f1f)!important;font-family:var(--pff,Poppins),system-ui,sans-serif!important;border-radius:var(--prad,999px)!important;text-transform:var(--ptt,none);letter-spacing:var(--pls,0);animation:none!important}
.themepill i{border-color:var(--pfg,#3b1f1f)!important}
.tmenu{background:var(--pbg,#fff)!important;color:var(--pfg,#3b1f1f)!important;border:var(--pbd,2.5px solid #3b1f1f)!important;font-family:var(--pff,Poppins),system-ui,sans-serif}
.tmenu button{color:var(--pfg,#3b1f1f)!important;font-family:inherit!important}.tmenu button:hover,.tmenu button.on{background:color-mix(in srgb,var(--pfg,#3b1f1f) 12%,transparent)!important}
.wrappill.ready::after{content:"";width:7px;height:7px;border-radius:50%;background:var(--pdot,#ff3f8e);margin-left:2px;animation:pdot 1.8s ease-in-out infinite}
@keyframes pdot{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--pdot,#ff3f8e) 60%,transparent)}50%{box-shadow:0 0 0 5px transparent}}
.cheerpill .cpc{background:var(--pfg,#3b1f1f)!important;color:var(--pbg,#fff)!important}
[data-theme="crayon"] .themepill,[data-theme="crayon"] .wrappill{font-size:14px!important;font-weight:700!important}
[data-theme="sampler"] .themepill,[data-theme="sampler"] .wrappill{font-size:11px!important}

.cheerstrip{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin:-6px 0 16px;padding:7px 10px;border:var(--pbd,2px solid var(--ink));border-radius:12px;background:var(--pbg,#fff);color:var(--pfg,var(--ink));box-shadow:var(--psh,none);font:600 12.5px/1.35 var(--pff,Poppins),system-ui,sans-serif;position:relative;z-index:1}
.dwrap.has-art .cheerstrip{max-width:min(780px,calc(100% - 360px))}
@media(max-width:900px){.dwrap.has-art .cheerstrip{max-width:none}}
.cheerstrip .cs-lab{font-weight:900;letter-spacing:.04em;font-size:11.5px;opacity:.85}
.cheerstrip .cs-item{display:inline-flex;align-items:center;gap:5px}
.cheerstrip .cs-item+.cs-item::before{content:"·";opacity:.4;margin-right:5px}
.cheerstrip .cs-go,.cheerstrip .cs-show{background:none;border:0;color:inherit;font:inherit;font-weight:800;text-decoration:underline;cursor:pointer;padding:0}
.cheerstrip .cs-x{margin-left:auto;background:none;border:0;color:inherit;opacity:.55;font:900 13px system-ui,sans-serif;cursor:pointer}
.cheerstrip.mini{display:inline-flex;padding:3px 10px}

/* ===== pill bar: grouped, finds a clear spot in each scene ===== */
#pillbar{position:fixed;top:var(--pbt,14px);right:16px;left:auto;bottom:auto;z-index:56;display:flex;align-items:center;gap:8px;flex-direction:row}
#pillbar.pl-left{left:16px;right:auto}#pillbar.pl-bottom{top:auto;bottom:var(--pbb,14px)}
#pillbar .themepill,#pillbar .wrappill{position:static!important;right:auto!important;top:auto!important}
#pillbar .tmenu{position:absolute!important;top:calc(100% + 8px)!important;right:0!important;left:auto}
#pillbar.pl-left .tmenu{left:0;right:auto!important}#pillbar.pl-bottom .tmenu{top:auto!important;bottom:calc(100% + 8px)}
#pillbar.compact .wrappill>span,#pillbar.compact #tname{display:none}
#pillbar.compact .wrappill,#pillbar.compact .themepill{padding-left:9px!important;padding-right:9px!important}
#pillbar.compact .themepill{padding:4px!important}
body.dopen #pillbar{top:14px!important;bottom:auto!important;right:16px!important;left:auto!important}
#sceneKey{top:var(--skt,14px)}#sceneKey.sk-bottom{top:auto;bottom:14px}
.dart.iso,.dart.iso *{overflow:visible!important}
.dart.iso *,.dart-measure *{clip-path:none!important;-webkit-mask:none!important;mask:none!important}
.dart.iso{-webkit-mask-image:none!important;mask-image:none!important}
.bars .blab{display:block;line-height:1.25;min-height:1.25em;white-space:nowrap}
.hnav{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 14px}.hnav b{font-family:var(--fh,Poppins);font-size:17px;min-width:150px;text-align:center}.hnav .chip[disabled]{opacity:.35;cursor:default}
#sceneInner [data-k],#sceneInner [data-act]{cursor:pointer}
#sceneInner [data-k]:not(.sc-hot):not(.sc-lab):hover,#sceneInner [data-k]:not(.sc-hot):not(.sc-lab):focus-visible,#sceneInner [data-act]:not(.sc-lab):hover{filter:drop-shadow(0 0 5px rgba(255,255,255,.95)) drop-shadow(0 0 12px rgba(255,220,120,.7));outline:none}
/* ===== themed drawer pieces ===== */
.btn,.btn.white{color:#3b1f1f}
.btn.teal{color:#fff}
.panel{position:relative}
.panel::before{content:"";position:absolute;left:-2.5px;right:-2.5px;top:-2.5px;height:0;border-radius:inherit;pointer-events:none}
.ck{transition:transform .15s,box-shadow .2s}.ck:hover{transform:scale(1.08)}
/* folders */
[data-theme="folders"] .panel{margin-top:18px;border-radius:0 14px 14px 14px}
[data-theme="folders"] .panel::before{left:-2.5px;right:auto;top:-20px;width:38%;height:20px;background:var(--c);border:2.5px solid var(--ink);border-bottom:0;border-radius:8px 14px 0 0}
[data-theme="folders"] .ck.on{box-shadow:2px 2px 0 var(--ink)}
/* haunted */
[data-theme="haunted"] .panel{padding-top:26px;background-image:repeating-linear-gradient(0deg,transparent 0 13px,rgba(20,18,24,.05) 13px 14px)}
[data-theme="haunted"] .panel::before{height:12px;border-radius:6px 6px 0 0;background:repeating-linear-gradient(90deg,#4fa39a 0 14px,#f08cb8 14px 28px,#f2b733 28px 42px,#a35fb5 42px 56px)}
[data-theme="haunted"] .ck{border-radius:9px 9px 3px 3px}
[data-theme="haunted"] .ck.on{background:#f2b733;color:#141218;box-shadow:0 0 10px 2px rgba(242,183,51,.75)}
[data-theme="haunted"] .pbar i{background:linear-gradient(90deg,#f2622e,#f2b733)}
[data-theme="haunted"] .cal .d.today{box-shadow:inset 0 0 0 3px #f2b733}
/* pink house */
[data-theme="pink"] .panel{padding-top:26px;border-radius:14px}
[data-theme="pink"] .panel::before{height:12px;border-radius:12px 12px 0 0;background:radial-gradient(circle at 8px 12px,#ff3f8e 7px,transparent 7.5px) 0 0/16px 12px repeat-x,#ffc2dc}
[data-theme="pink"] .ck{border-radius:50%}
[data-theme="pink"] .ck.on{background:#ff3f8e;box-shadow:0 0 10px rgba(255,63,142,.6)}
[data-theme="pink"] .pbar i{background:repeating-linear-gradient(90deg,#ff3f8e 0 10px,#ff8fc0 10px 20px)}
/* rainbow */
[data-theme="rainbow"] .panel{padding-top:22px}
[data-theme="rainbow"] .panel::before{left:0;right:0;top:0;height:10px;border-radius:19px 19px 0 0;background:linear-gradient(90deg,#ff4a3d,#ff9a1f,#ffd21f,#2ec26a,#2f7bff,#9b5cff,#ff7ac8)}
[data-theme="rainbow"] .ck{border-radius:50%;border-color:#111}
[data-theme="rainbow"] .ck.on{background:radial-gradient(circle at 50% 55%,#111 0 4px,#fff 4.5px 8px,var(--hc) 8.5px)}
[data-theme="rainbow"] .ck.on{font-size:0}
[data-theme="rainbow"] .pbar i{background:linear-gradient(90deg,#ff4a3d,#ff9a1f,#ffd21f,#2ec26a,#2f7bff,#9b5cff)}
/* psychedelic */
[data-theme="psych"] .panel{padding-top:28px}
[data-theme="psych"] .panel::before{height:14px;border-radius:20px 20px 0 0;background:linear-gradient(90deg,#e8402a 0 25%,#f48fb1 0 50%,#f59b2b 0 75%,#f5c518 0)}
[data-theme="psych"] .ck{border-radius:50%}
[data-theme="psych"] .ck.on{background:conic-gradient(#e8402a,#f59b2b,#f5c518,#f48fb1,#e8402a);color:#2a2420}
[data-theme="psych"] .pbar i{background:repeating-linear-gradient(90deg,#e8402a 0 12px,#f59b2b 12px 24px,#f5c518 24px 36px,#f48fb1 36px 48px)}
/* chromatic */
[data-theme="chromatic"] .ck{border-radius:50%;border-width:1px}
[data-theme="chromatic"] .ck.on{background:radial-gradient(circle at 35% 30%,#fff,var(--hc) 60%,#141414 140%);color:transparent}
[data-theme="chromatic"] .pbar{border-width:0;height:7px;background:#e6e1d8}
[data-theme="chromatic"] .pbar i{background:linear-gradient(90deg,#2f5bd6,#c64bd1,#e8463a,#f5b31f)}
[data-theme="chromatic"] .panel h2{letter-spacing:-.02em}
/* strange */
[data-theme="strange"] .panel{padding-top:26px}
[data-theme="strange"] .panel::before{height:12px;border-radius:0;background:repeating-linear-gradient(90deg,#0f0f0f 0 10px,#e8e6e1 10px 20px)}
[data-theme="strange"] .ck{border-radius:2px;transform:rotate(-2deg)}
[data-theme="strange"] .ck.on{background:#0f0f0f;color:#e8e6e1}
[data-theme="strange"] .pbar{border-radius:0}[data-theme="strange"] .pbar i{background:repeating-linear-gradient(90deg,#0f0f0f 0 8px,#555 8px 12px)}
/* departure */
[data-theme="departure"] .panel{padding-top:28px}
[data-theme="departure"] .panel::before{left:0;right:0;top:0;height:12px;border-radius:14px 14px 0 0;background:repeating-linear-gradient(90deg,#d6402b 0 18px,#f3e6cc 18px 24px,#0f2c58 24px 42px,#f3e6cc 42px 48px)}
[data-theme="departure"] .panel h2{text-transform:uppercase;letter-spacing:.08em;font-size:15px}
[data-theme="departure"] .ck{border-radius:4px;border-color:#0f2c58}
[data-theme="departure"] .ck.on{background:#d6402b}
[data-theme="departure"] .pbar i{background:repeating-linear-gradient(90deg,#0f2c58 0 6px,transparent 6px 10px),#d6402b}
/* pixel */
[data-theme="pixel"] .panel{padding-top:36px}
[data-theme="pixel"] .panel::before{left:-3px;right:-3px;top:-3px;height:24px;border-radius:0;background:#ee6aa5;border:3px solid #5a2340}
[data-theme="pixel"] .panel::after{content:"_ □ ✕";position:absolute;right:12px;top:2px;font:700 12px 'Silkscreen',monospace;color:#fff}
[data-theme="pixel"] .ck{border-radius:0;border-width:3px}
[data-theme="pixel"] .ck.on{background:#ee6aa5;box-shadow:3px 3px 0 #5a2340}
[data-theme="pixel"] .pbar{border-radius:0;border-width:3px}[data-theme="pixel"] .pbar i{background:repeating-linear-gradient(90deg,#ee6aa5 0 10px,#fde8f1 10px 12px)}
/* neo */
[data-theme="neo"] .panel{padding-top:40px}
[data-theme="neo"] .panel::before{left:-3px;right:-3px;top:-3px;height:28px;border-radius:10px 10px 0 0;background:radial-gradient(circle at 16px 14px,#fff 4px,#111 4.5px 6px,transparent 6.5px),radial-gradient(circle at 34px 14px,#fff 4px,#111 4.5px 6px,transparent 6.5px),radial-gradient(circle at 52px 14px,#fff 4px,#111 4.5px 6px,transparent 6.5px),var(--c);border:3px solid #111}
[data-theme="neo"] .ck{border-width:3px;border-radius:6px}
[data-theme="neo"] .ck.on{background:#c6f24e;color:#111;box-shadow:3px 3px 0 #111}
[data-theme="neo"] .pbar{border-width:3px}[data-theme="neo"] .pbar i{background:#c6f24e}
/* satellite */
[data-theme="satellite"] .panel{background:radial-gradient(ellipse at 0 120%,rgba(255,74,46,.25),transparent 55%),#fde4e8}
[data-theme="satellite"] .ck{border-radius:50%;border-width:1.5px;background:transparent}
[data-theme="satellite"] .ck.on{background:radial-gradient(circle,#fff 0 20%,#e8264a 60%);color:transparent;box-shadow:0 0 12px rgba(255,90,110,.9)}
[data-theme="satellite"] .pbar{border-width:1.5px;background:transparent}[data-theme="satellite"] .pbar i{background:#e8264a;box-shadow:0 0 10px #ff6a7a}
/* patchwork */
[data-theme="patchwork"] .panel{background-image:repeating-linear-gradient(45deg,transparent 0 10px,rgba(240,122,168,.06) 10px 20px)}
[data-theme="patchwork"] .ck{border-style:dashed;border-radius:4px}
[data-theme="patchwork"] .ck.on{border-style:solid;background:#f07aa8}
[data-theme="patchwork"] .pbar i{background:repeating-linear-gradient(90deg,#f07aa8 0 14px,#e9b949 14px 28px,#3fa66b 28px 42px,#b9a3ef 42px 56px)}
/* black cat */
[data-theme="blackcat"] .panel{border-radius:3px 6px 4px 7px}
[data-theme="blackcat"] .panel:nth-child(odd){transform:rotate(-.3deg)}[data-theme="blackcat"] .panel:nth-child(even){transform:rotate(.3deg)}
[data-theme="blackcat"] .panel h2{font-weight:400;font-size:26px}
[data-theme="blackcat"] .ck{border-radius:47% 53% 45% 55%/52% 46% 54% 48%;border-width:1.8px}
[data-theme="blackcat"] .ck.on{background:#fff;color:#111;font-family:'Reenie Beanie',cursive;font-size:22px}
[data-theme="blackcat"] .pbar{border-width:1.5px}[data-theme="blackcat"] .pbar i{background:repeating-linear-gradient(-45deg,#111 0 2px,transparent 2px 6px)}
/* checker */
[data-theme="checker"] .panel{padding-top:26px}
[data-theme="checker"] .panel::before{height:12px;border-radius:14px 14px 0 0;background:repeating-conic-gradient(#fff7ec 0 25%,transparent 0 50%) 0 0/12px 12px,linear-gradient(90deg,#3a6ee8 0 25%,#1fb59a 0 50%,#f5b800 0 75%,#ff5fa8 0)}
[data-theme="checker"] .ck.on{background:var(--c,#ff5fa8)}
[data-theme="checker"] .pbar i{background:repeating-conic-gradient(rgba(255,247,236,.55) 0 25%,transparent 0 50%) 0 0/10px 10px,linear-gradient(90deg,#3a6ee8,#1fb59a,#f5b800,#ff7a3d,#ff5fa8)}
/* crayon */
[data-theme="crayon"] .panel{padding-top:26px}
[data-theme="crayon"] .panel::before{height:14px;border-radius:6px 6px 0 0;background:linear-gradient(90deg,#ff3d9a 0 14%,#ffe12a 0 28%,#2f5bff 0 42%,#b8e62a 0 57%,#ff8a1f 0 71%,#1fc3c3 0 85%,#8a3dff 0)}
[data-theme="crayon"] .ck{border-radius:8px;transform:rotate(-3deg)}
[data-theme="crayon"] .ck.on{background:repeating-linear-gradient(35deg,rgba(255,255,255,.3) 0 2px,transparent 2px 5px),var(--hc)}
[data-theme="crayon"] .pbar i{background:repeating-linear-gradient(35deg,rgba(255,255,255,.35) 0 2px,transparent 2px 6px),#ff3d9a}

function summary(k){
  var s={num:'',unit:'',pct:0,lines:[],next:'',pill:'',tags:[]};
  if(k==='habits'){var t=todayStats(),wk=D.habits.filter(function(h){return h.weekly});
    s.num=t.n+'/'+t.of;s.unit='today';s.pct=t.of?t.n/t.of*100:0;
    var done=hDone(ymd(TODAY));s.lines=dailyHabits().slice(0,2).map(function(h){return {t:h.name,done:done.indexOf(h.id)>-1}});
    wk.forEach(function(h){s.lines.push({t:h.name+' — '+weeklyCount(h,TODAY)+' of '+h.weekly+' this week',done:weeklyCount(h,TODAY)>=h.weekly})});
    s.lines=s.lines.slice(0,3);
    s.next=t.n===t.of?'all done today ✓':'check off today';s.pill=t.n>=Math.ceil(t.of*.7)?'Win':'Today';
    s.tags=t.n>=Math.ceil(t.of*.7)?['wins','in-progress']:(t.n?['in-progress']:['untouched'])}
  else if(k==='period'){var p=period();s.num='Day '+p.day;s.unit=PH[p.phase].n;s.pct=Math.min(100,p.day/D.period.cycle*100);
    s.lines=[{t:'Next est. '+nice(p.next)},{t:PH[p.phase].tip}].slice(0,2);s.next={mens:'lighter week, by design',foll:'ease into more',ovu:'big-energy day',lut:'keep plans light'}[p.phase];s.pill='Cycle';s.tags=['in-progress']}
  else if(k==='upcoming'){var u=upcoming();var d0=u.length?daysBetween(TODAY,parse(u[0].date)):null;
    s.num=u.length?String(d0):'—';s.unit=u.length?(d0===1?'day to next':'days to next'):'nothing scheduled';s.pct=u.length?Math.max(5,100-d0*6):0;
    s.lines=u.slice(0,3).map(function(e){return {t:nice(parse(e.date))+' — '+e.title}});s.next=u.length?u[0].title:'open shared calendar';
    s.pill=u.length&&d0<=7?'Due soon':'Calendar';s.tags=u.length&&d0<=7?['due-soon']:[]}
  else if(k==='nails'&&nails().off){var n0=nails();s.num='Bare';s.unit='since '+MON[n0.off.getMonth()]+' '+n0.off.getDate();s.pct=0;s.lines=[{t:'Nails off — '+n0.bare+' day'+(n0.bare===1?'':'s')},{t:'Countdown paused'},{t:'Tap Fresh set when you get one'}];s.next='book a set when ready';s.pill='Paused';s.tags=[]}

    s.next=n.days<=7?'plan it this week':'nothing yet';s.pill=n.days<=7?'Due soon':'Later';s.tags=n.days<=7?['due-soon']:[]}
  else if(k==='endeavors'){var need=fashionNeeds().length;s.num=String(D.vision.length);s.unit='vision goals';s.pct=Math.round((D.fashion.length-need)/D.fashion.length*100);
    s.lines=[{t:'Pink chopper + permit'},{t:'Learn sewing'},{t:need+' fashion needs → To Buy'}];s.next='sewing is the first step';s.pill='Vision';s.tags=['in-progress']}
  else if(k==='money'){s.num='Open';s.unit='separate app';s.pct=100;s.lines=[{t:'Lives on its own page'},{t:'Tile + link only'}];s.next='open Money Pals ↗';s.pill='Link';s.tags=[]}
  else{var it=listItems(k);if(k==='tobuy')it=it.concat(fashionNeeds());var dn=it.filter(function(x){return x.done}).length;
    s.num=String(it.length-dn);s.unit=k==='tobuy'?'to get':'open';s.pct=it.length?dn/it.length*100:0;
    s.lines=priSort(it.filter(function(x){return !x.done})).slice(0,3).map(function(x){return {t:(x.pri?'★ ':'')+x.t}});var np=it.filter(function(x){return x.pri&&!x.done}).length;

  return s;

var PRI_SKIP={};
function priCands(){var out=[],p=period(),phase=p.phase,dnext=daysBetween(TODAY,p.next),u=upcoming().filter(function(e){return daysBetween(TODAY,parse(e.date))<=14}),m=TODAY.getMonth();

  function words(t){return (t.toLowerCase().match(/[a-z]{4,}/g)||[]).filter(function(w){return !STOP[w]})}
  function score(t,note,key,item,fashion){var sc=0,why=[],txt=(t+' '+(note||'')).toLowerCase();
    if(/high priority|urgent|asap|\bsoon\b|first|before /.test(txt)){sc+=4;why.push(/high priority/.test(txt)?'you marked it high priority':'you noted it’s time-sensitive')}
    if(/\b(call|book (a|an|the|my)|appointment|appt|schedule|renew|pay|bill|deadline|return|refund|cancel|rsvp|register|insurance|pharmacy|doctor|dentist|vet)\b/.test(txt)){sc+=3;why.push('it’s time-sensitive')}
    if(/flu shot|vaccine|booster/.test(txt)&&m>=8&&m<=11){sc+=3;why.push('it’s flu season')}
    u.forEach(function(e){var ew=words(e.title+' '+(e.when||''));if(words(t).some(function(w){return ew.indexOf(w)>-1})){sc+=3;why.push('it ties to '+e.title+' ('+nice(parse(e.date))+')')}});
    if(/\btrip|travel|flight|pack|suitcase|toiletr/.test(txt)&&u.some(function(e){return /flight|trip|travel/i.test(e.title)})){sc+=3;why.push('your trip is coming up')}
    if(dnext>=0&&dnext<=5&&/\b(pad|pads|tampon|ibuprofen|advil|midol|heating pad|chocolate|period)\b/.test(txt)){sc+=4;why.push('your period is due in '+dnext+' day'+(dnext===1?'':'s'))}
    if(key==='tobuy'&&!fashion&&t.trim().split(/\s+/).length>=2&&todoTxt.indexOf(t.toLowerCase().trim())>-1){sc+=2;why.push('it unblocks something on your To Do')}

  Object.keys(D.lists).forEach(function(key){D.lists[key].forEach(function(sct,si){sct.items.forEach(function(it){if(it.done||it.pri||PRI_SKIP[it.id])return;var r=score(it.t,it.note,key,it);if(r.sc>=3)out.push({k:key,si:si,id:it.id,b:bucketOf(key).name,t:it.t,sc:r.sc+(key==='todo'?0.5:0),why:r.why})})})});

function layoutScene(Wu){var sc=SCENES[theme],inner=$('#sceneInner');if(!sc)return;

  if(Wu>641){try{spreadScene(Wu)}catch(e){inner.innerHTML=sc.body;Wu=640}}
  inner.style.width=Wu+'px';sceneWu=Wu;sceneWuFor=theme;
  inner.querySelectorAll('[data-live]').forEach(function(e){e.textContent=liveText(e)});sceneAffordances(inner)}
var ACT_TITLE={next:'See what’s next',more:'Open everything',dump:'Brain dump',where:'Ideas for today',wins:'See your wins'};
function sceneAffordances(root){[].slice.call(root.querySelectorAll('[data-act="more"]')).forEach(function(el){var w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT),n;while((n=w.nextNode())){n.textContent=n.textContent.replace(/\bMORE\b/,'OPEN').replace(/\bMore\b/,'Open').replace(/\bmore\b/,'open')}});
  [].slice.call(root.querySelectorAll('[data-k],[data-act]')).forEach(function(el){if(el.getAttribute('title'))return;var k=el.dataset.k,a=el.dataset.act,b=k&&bucketOf(k);var t=b?'Open '+b.name:ACT_TITLE[a]||'';if(t){el.setAttribute('title',t);if(!el.getAttribute('aria-label')&&!el.textContent.trim())el.setAttribute('aria-label',t)}if(!el.hasAttribute('tabindex')&&!/^(BUTTON|A)$/.test(el.tagName))el.setAttribute('tabindex','0')})}

/* find clear spots for the pill bar + scene key so they never cover scene text */
function sceneTextRects(){var R=[],root=$('#sceneInner');if(!root)return R;var tw=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:function(n){return n.textContent.trim()?1:2}}),n;
  while((n=tw.nextNode())){var el=n.parentElement;if(!el)continue;var cs=getComputedStyle(el);if(cs.visibility==='hidden'||+cs.opacity===0||cs.display==='none')continue;if(el.closest('svg')&&!el.closest('text'))continue;
    var rg=document.createRange();rg.selectNodeContents(n);[].slice.call(rg.getClientRects()).forEach(function(r){if(r.width>1&&r.height>1)R.push(r)})}
  [].slice.call(root.querySelectorAll('[data-k],[data-act]')).forEach(function(el){var r=el.getBoundingClientRect();if(r.width>1&&r.width<window.innerWidth*.6&&r.height<window.innerHeight*.5)R.push(r)});return R}
function hits(box,R,pad){pad=pad||4;var n=0;R.forEach(function(r){if(box.l<r.right+pad&&r.left-pad<box.r&&box.t<r.bottom+pad&&r.top-pad<box.b)n++});return n}
function placePills(){var pb=$('#pillbar');if(!pb)return;pb.classList.remove('pl-left','pl-bottom','compact');document.documentElement.style.setProperty('--pbt','14px');
  var sk=$('#sceneKey');if(sk){sk.classList.remove('sk-bottom');document.documentElement.style.setProperty('--skt','14px')}
  if(document.body.classList.contains('dopen')||!SCENES[theme]||!document.documentElement.classList.contains('scene-on'))return;
  var R=sceneTextRects(),W=window.innerWidth,H=window.innerHeight;
  function measure(compact){pb.classList.toggle('compact',compact);var r=pb.getBoundingClientRect();return {w:r.width,h:r.height}}
  var best=null;
  [false,true].forEach(function(cp){if(best&&best.n===0)return;var m=measure(cp);
    for(var y=14;y<=H*0.32;y+=6){var box={l:W-16-m.w,r:W-16,t:y,b:y+m.h},n=hits(box,R);if(!best||n<best.n||(n===best.n&&false))best={n:n,cp:cp,y:y,side:'tr'};if(n===0)return}
    [['tl',16],['br',0],['bl',0]].forEach(function(c){if(best&&best.n===0)return;var box=c[0]==='tl'?{l:16,r:16+m.w,t:14,b:14+m.h}:c[0]==='br'?{l:W-16-m.w,r:W-16,t:H-14-m.h,b:H-14}:{l:16,r:16+m.w,t:H-14-m.h,b:H-14};var n=hits(box,R);if(n<best.n)best={n:n,cp:cp,y:14,side:c[0]}})});
  pb.classList.toggle('compact',best.cp);if(best.side==='tr')document.documentElement.style.setProperty('--pbt',best.y+'px');else{pb.classList.toggle('pl-left',best.side==='tl'||best.side==='bl');pb.classList.toggle('pl-bottom',best.side==='br'||best.side==='bl')}
  if(sk&&getComputedStyle(sk).display!=='none'){var kr=sk.getBoundingClientRect(),PB=pb.getBoundingClientRect(),kb=null;
    for(var y2=14;y2<=H*0.32;y2+=6){var bx={l:14,r:14+kr.width,t:y2,b:y2+kr.height},nn=hits(bx,R)+((bx.l<PB.right&&PB.left<bx.r&&bx.t<PB.bottom&&PB.top<bx.b)?5:0);if(!kb||nn<kb.n)kb={n:nn,y:y2};if(nn===0)break}
    if(kb.n>0){var bb={l:14,r:14+kr.width,t:H-14-kr.height,b:H-14};if(hits(bb,R)<kb.n){sk.classList.add('sk-bottom');kb=null}}
    if(kb)document.documentElement.style.setProperty('--skt',kb.y+'px')}}
function fitScene(){var el=$('#sceneInner'),W=window.innerWidth,H=window.innerHeight;var s=Math.min(W/640,H/440),off=0;
  if(document.body.classList.contains('dopen')){var BH=Math.round(Math.min(220,Math.max(150,H*.24)));document.documentElement.style.setProperty('--bh',BH+'px');s=Math.min(BH/240,W/640);var vis=BH/s;off=Math.max(0,Math.min(Math.max(0,440-vis),(FOCUS[theme]||120)-vis/2));H=BH;
    el.style.transformOrigin='top center';el.style.transform='translateY('+(-off*s).toFixed(1)+'px) scale('+s+')'}
  else{var want=640;if(W/H>640/440){s=H/440;want=Math.round(W/s)}if(sceneWuFor!==theme||Math.abs(want-sceneWu)>1)layoutScene(want);
    el.style.transformOrigin='center center';el.style.transform='scale('+s+')'}
  if(document.body.classList.contains('dopen')&&sceneWu!==640&&sceneWuFor===theme){/* keep */}
  try{fitExt(s,W,H,false)}catch(e){}
  var sc=SCENES[theme];var g=$('#sceneGrain');g.style.display=theme==='haunted'?'block':'none';
  if(sc&&typeof sc.bg==='object'){var S=$('#scene').style;S.background='';S.backgroundColor=sc.bg.c;S.backgroundImage=sc.bg.i;S.backgroundSize=sc.bg.s.split(',').map(function(x){return /px/.test(x)?x.replace(/[\d.]+px/g,function(p){return (parseFloat(p)*s).toFixed(1)+'px'}):x}).join(',');S.backgroundPosition='center'}
  else if(sc&&sc.ground){var gt=off||document.body.classList.contains('dopen')?Math.round((sc.ground[0]-off)*s):Math.round((H-440*s)/2+sc.ground[0]*s);$('#scene').style.background='linear-gradient(to bottom,'+sc.bg+' 0 '+gt+'px,'+sc.ground[1]+' '+gt+'px 100%)'}else if(sc){$('#scene').style.background=sc.bg}
  var w=$('#sceneWeb');w.style.display=theme==='haunted'?'block':'none';w.style.width=w.style.height=Math.round(160*s)+'px';setTimeout(placePills,60)}
function renderScene(){var sc=SCENES[theme];
  document.documentElement.classList.toggle('scene-on',!!sc);
  if(!sc){$('#sceneKey').style.display='none';return}
  if(sceneLoaded!==theme){sceneLoaded=theme;
    var st=$('#sceneStyle');if(!st){st=document.createElement('style');st.id='sceneStyle';document.head.appendChild(st)}st.textContent=sc.style;
    if(sc.font&&!loadedFonts['scene-'+theme]){loadedFonts['scene-'+theme]=1;var l=document.createElement('link');l.rel='stylesheet';l.href=sc.font.replace(/&amp;/g,'&');document.head.appendChild(l)}
    sceneWuFor=null;fitScene()}
  $('#sceneInner').querySelectorAll('[data-live]').forEach(function(e){e.textContent=liveText(e)});
  $('#sceneKey').style.display=sc.more?'flex':'none';
}
var rzT=null;window.addEventListener('resize',function(){if(!SCENES[theme])return;clearTimeout(rzT);rzT=setTimeout(fitScene,120)});
$('#sceneKey').addEventListener('click',function(e){var b=e.target.closest('[data-act]');if(!b)return;var ev=new MouseEvent('click',{bubbles:true});var tmp=document.createElement('span');tmp.setAttribute('data-act',b.dataset.act);tmp.style.display='none';$('#sceneInner').appendChild(tmp);tmp.dispatchEvent(ev);tmp.remove()});
$('#sceneInner').addEventListener('keydown',function(e){if(e.key!=='Enter'&&e.key!==' ')return;var b=e.target.closest('[data-k],[data-act]');if(b&&!/^(BUTTON|A)$/.test(b.tagName)){e.preventDefault();b.click()}});
$('#sceneInner').addEventListener('click',function(e){var b=e.target.closest('[data-k],[data-act]');if(!b)return;
  var k=b.dataset.k,a=b.dataset.act;
  if(k){if(k==='money'){window.open(D.moneyUrl,'_blank','noopener');return}openDrawer(k);return}
  if(a==='next'){openPlan();return}
  if(a==='dump'){$('#dumpBtn').click();return}
  if(a==='where'){$('#nextBtn').click();return}
  if(a==='wins'){var w=winsList();openModal('<h2>Wins ★</h2>'+(w.length?w.map(function(x){return '<div class="row"><span>✓</span><div class="t"><span>'+esc(x[1])+'</span><small>'+esc(x[0])+'</small></div></div>'}).join(''):'<p class="note">Nothing checked off yet — your wins show up here.</p>')+'<div class="add"><button class="btn white" data-act="close">Close</button></div>');return}
  if(a==='more'){openModal('<h2>Open your mind map</h2><div class="morelist"><button data-mk="wrapped" style="--c:#ffe08a">✨ Wrapped<small>'+esc(wrapLabel())+'</small></button>'+BUCKETS.map(function(bk,i){var s=summary(bk.k);return '<button data-mk="'+bk.k+'" style="--c:'+pal(i,bk)[0]+'">'+esc(bk.name)+(bk.ext?' ↗':'')+'<small>'+esc(s.num+' '+s.unit)+'</small></button>'}).join('')+'</div><div class="add"><button class="btn white" data-act="close">Close</button></div>');
    $('#mpanel').querySelectorAll('[data-mk]').forEach(function(bt){bt.addEventListener('click',function(){closeModal();var mk=bt.dataset.mk;if(mk==='money')window.open(D.moneyUrl,'_blank','noopener');else openDrawer(mk)})});return}
});

var saved='folders';try{saved=localStorage.getItem(TKEY)||'folders'}catch(e){}if(saved==='pixel')saved='lava';
applyTheme(saved);try{document.fonts.ready.then(function(){setTimeout(placePills,100)})}catch(e){}setTimeout(placePills,1500);
</script>
